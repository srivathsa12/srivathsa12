name: Rebuild profile

# Every night: pull live repos and activity from the GitHub API and redraw the panels.
on:
  schedule:
    - cron: "35 18 * * *"   # 00:05 IST
  workflow_dispatch:
  push:
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw panels from live GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/forge.py
      - name: Commit if anything changed
        run: |
          git config user.name  "profile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets scripts/data.json
          git diff --cached --quiet || git commit -m "Rebuild profile ($(date -u +%F))"
          git push
