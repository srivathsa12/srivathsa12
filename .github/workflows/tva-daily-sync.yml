name: TVA daily sync

# Every night the TVA recounts the variant: pulls live repos, activity and languages
# from the GitHub API, then re-forges every panel (stats, feed, Doomsday countdown).
on:
  schedule:
    - cron: "35 18 * * *"   # 00:05 IST
  workflow_dispatch:
  push:
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forge panels from live GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/forge.py

      - name: Commit if anything changed
        run: |
          git config user.name  "tva-analyst-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets scripts/data.json
          git diff --cached --quiet || git commit -m "TVA: daily sync ($(date -u +%F))"
          git push

